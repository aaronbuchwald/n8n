[project]
name = "designcheck"
version = "0.1.0"
description = "Engineering design checks: a versioned knowledge base of materials, products and building-code clauses, compiled into a calcsheet Calc"
readme = "README.md"
# 3.11 for `tomllib`: the knowledge base is TOML and must not need a dependency.
requires-python = ">=3.11"
# One runtime dep, and it is a sibling in this repo. Everything else is stdlib:
# the KB reader is `tomllib`, the FEM reader is `csv`, and the dimensional
# checks at the boundaries are the small `units` module in this package.
dependencies = [
    "calcsheet",
]

[project.optional-dependencies]
# `uv run --extra dev python -m pytest -q`
dev = ["pytest>=8.0"]

# `calcsheet` is the sibling library in this repo, not a PyPI release.
[tool.uv.sources]
calcsheet = { path = "../calcsheet" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The `kb/` TOML tree ships inside the package — the demo must run out of the box.
packages = ["src/designcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
