[project]
name = "graph-engine"
version = "0.1.0"
description = "Headless, UI-agnostic graph engine (Phase 0): node_spec, Graph, run, to_python"
readme = "README.md"
requires-python = ">=3.10"
# The engine and the example are pure standard library — no runtime deps.
dependencies = []

[project.optional-dependencies]
# `uv sync --extra dev` — run the test suite.
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# `engine` from ".", the minimal example module from "examples/minimal".
# Fully self-contained — no reference to any other project.
pythonpath = [".", "examples/minimal"]
testpaths = ["tests"]

[tool.uv]
# Imported from source; nothing to build/install as a wheel.
package = false
