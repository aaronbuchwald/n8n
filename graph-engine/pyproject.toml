[project]
name = "graph-engine"
version = "0.1.0"
description = "Headless, UI-agnostic graph engine (Phase 0): node_spec, Graph, run, to_python"
readme = "README.md"
requires-python = ">=3.10"
# The engine and the example are pure standard library — no runtime deps.
dependencies = []

[project.optional-dependencies]
# `uv sync --extra server` — the FastAPI HTTP service.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# `uv sync --extra dev` — run the full test suite (includes server deps).
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Real, installable packages, so `import engine` / `import server` work anywhere
# (examples, node packs, tests) without any sys.path manipulation.
packages = ["engine", "server"]

[tool.pytest.ini_options]
# `engine` is installed into the venv; only the example module needs a path.
pythonpath = ["examples/minimal"]
testpaths = ["tests"]
