[project]
name = "graph-engine"
version = "0.1.0"
description = "Headless, UI-agnostic graph engine (Phase 0): node_spec, Graph, run, to_python"
readme = "README.md"
requires-python = ">=3.10"
# The engine and the example are pure standard library — no runtime deps.
dependencies = []

[project.optional-dependencies]
# `uv sync --extra dev` — run the test suite.
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The engine is a real, installable package, so `import engine` works anywhere
# (examples, server, node packs) without any sys.path manipulation.
packages = ["engine"]

[tool.pytest.ini_options]
# `engine` is installed into the venv; only the example module needs a path.
pythonpath = ["examples/minimal"]
testpaths = ["tests"]
