[project]
name = "nodezator-structural-demo"
version = "0.1.0"
description = "Nodezator function-to-node demo: CSV -> select -> unit-aware math -> handcalcs equations -> assert f(x) < 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core calculation logic (demolib + run_demo.py) needs only these two.
    "forallpeople>=2.6.0",
    "handcalcs>=1.6.0",
]

[project.optional-dependencies]
# `uv sync --extra export` — Markdown/PDF export + round-trip (export_report.py).
export = [
    "playwright>=1.40",
    "pypdf>=4.0",
]
# `uv sync --extra app` — the Nodezator GUI itself (only to open the graph visually).
app = [
    "nodezator>=1.5.0",
]

[tool.uv]
# Dependency-only project: don't try to build/install this repo as a wheel.
# `demolib` is imported from source, so `uv run python run_demo.py` just works.
package = false
