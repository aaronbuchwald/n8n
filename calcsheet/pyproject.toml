[project]
name = "calcsheet"
version = "0.1.0"
description = "Declarative engineering calculations rendered as self-contained C4 four-slot HTML cards"
readme = "README.md"
requires-python = ">=3.10"
# Two runtime deps, both pure Python: sympy parses/typesets the math,
# latex2mathml turns its LaTeX into native MathML. No node, no CDN, no JS.
dependencies = [
    "sympy>=1.13,<2",
    "latex2mathml>=3.77,<4",
]

[project.optional-dependencies]
# `uv run --extra dev python -m pytest -q`
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calcsheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
